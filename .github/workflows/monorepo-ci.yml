name: Monorepo CI/CD OSS

on:
  push:
    tags:
      - "console-v*"
      - "test-v*"

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    env:
      OSS_BUCKET: yaklang
      OSS_REGION: oss-accelerate
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.7"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.9.0

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 获取 tag 名
        id: get-tag
        run: echo "TAG_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: 解析目标项目
        id: set-target
        run: |
          case "${TAG_NAME}" in
            console-*) echo "TARGET_PROJECT=console" >> $GITHUB_ENV ;;
            test-*)     echo "TARGET_PROJECT=api" >> $GITHUB_ENV ;;
            *)         echo "TARGET_PROJECT=unknown" >> $GITHUB_ENV ;;
          esac
          echo "TARGET_TAG=${TAG_NAME}" >> $GITHUB_ENV

      - name: 打印信息
        run: echo "TARGET_PROJECT=${TARGET_PROJECT}, TAG=${TARGET_TAG}"

      - name: 构建目标 (Turbo)
        if: env.TARGET_PROJECT != 'unknown'
        run: pnpm turbo run build --filter=${TARGET_PROJECT}

      - name: 打包文件
        if: env.TARGET_PROJECT != 'unknown'
        run: |
          cd apps/${TARGET_PROJECT}
          tar -zcvf ${TARGET_TAG}.tgz dist

      - name: 上传到 OSS
        if: env.TARGET_PROJECT != 'unknown'
        uses: tvrcgo/upload-to-oss@master
        with:
          key-id: ${{ secrets.OSS_KEY_ID }}
          key-secret: ${{ secrets.OSS_KEY_SECRET }}
          region: ${{ env.OSS_REGION }}
          bucket: ${{ env.OSS_BUCKET }}
          assets: |
            apps/${{ env.TARGET_PROJECT }}/${{ env.TARGET_TAG }}.tgz:/yakitBusinessLibrary/${{ env.TARGET_PROJECT }}/${{ env.TARGET_TAG }}.tgz
