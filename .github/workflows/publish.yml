name: Publish Yakit UI packages

on:
  push:
    branches:
      - main
      - "pre/**"
  workflow_dispatch:
    inputs:
      recovery:
        description: Recover missing packages and metadata from verified evidence
        required: true
        type: boolean
        default: false
      reconciliation_only:
        description: Read-only reconciliation of an already published exact artifact (no retry)
        required: false
        type: boolean
        default: false
      source_run_id:
        description: Source workflow run ID for recovery
        required: false
        type: string
      verification_artifact_id:
        description: Exact verification artifact ID for recovery
        required: false
        type: string
      authorize_retry:
        description: Authorize retry only from a definitive NOT_ATTEMPTED/NOT_APPLIED receipt
        required: false
        type: boolean
        default: false
      retry_intent_artifact_id:
        description: Exact prior durable intent artifact ID for authorized retry
        required: false
        type: string
      retry_receipt_artifact_id:
        description: Exact prior definitive no-success receipt artifact ID for authorized retry
        required: false
        type: string
      incident_id:
        description: Checked-in one-time incident policy ID for an exact recovery exception
        required: false
        type: string

permissions: {}

concurrency:
  group: yakit-ui-npm-release
  cancel-in-progress: false

env:
  NODE_VERSION: 24.12.0
  PNPM_VERSION: 10.34.5
  CHANGESETS_ACTION_SHA: 8488615a623b1b9c987934bb89eae8af6a946ac1
  PUBLICATION_REGISTRY_PROPAGATION_WINDOW_MS: 30000
  PUBLICATION_REGISTRY_OBSERVATION_MAX_AGE_MS: 300000

jobs:
  select-mode:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select.outputs.publish-plan-artifact-id }}
      publish-plan-base64: ${{ steps.publish-plan.outputs.publish-plan-base64 }}
      publish-plan-sha256: ${{ steps.publish-plan.outputs.publish-plan-sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-21
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, reviewed 2026-08-21
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, reviewed 2026-08-21
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate branch and Changesets prerelease state
        run: pnpm run release:preflight
      - name: Verify deferred release scope and committed input hashes
        run: |
          # Prerelease checkouts may have origin/main without a local main branch.
          git show-ref --verify --quiet refs/heads/main || git branch --no-track main refs/remotes/origin/main
          pnpm run release:deferral-check
      - name: Collect complete cutover evidence
        run: >-
          node scripts/release/collect-release-cutover-evidence.mjs
          .release/cutover-evidence.json .release/cutover-producer.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Enforce the v3 release cutover
        run: node scripts/release/release-cutover-preflight.mjs
        env:
          RELEASE_CUTOVER_EVIDENCE: .release/cutover-evidence.json
          RELEASE_PRODUCER_IDENTITY: .release/cutover-producer.json
      - name: Select Changesets mode
        id: select
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1 commit, reviewed 2026-08-21
      - name: Export exact Changesets publish plan
        if: steps.select.outputs.mode == 'publish'
        id: publish-plan
        run: node scripts/release/publish-plan-job-output.mjs export "${RUNNER_TEMP}"

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-21
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, reviewed 2026-08-21
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, reviewed 2026-08-21
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create or update Version Packages pull request
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1 commit, reviewed 2026-08-21
        with:
          github-token: ${{ github.token }}
          script: pnpm version-packages
          commit-message: Version Packages
          pr-title: Version Packages
          pr-base-branch: ${{ github.ref_name }}
          push-with-git-cli: false

  build-and-pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
      impact-artifact-id: ${{ steps.upload-impact.outputs.artifact-id }}
    steps:
      - name: Reserve disk space for isolated release builds
        run: |
          df -h /
          # This Node/React release does not use the hosted runner's Android SDK.
          sudo rm -rf /usr/local/lib/android
          df -h /
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-21
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, reviewed 2026-08-21
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, reviewed 2026-08-21
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore exact Changesets publish plan
        run: >-
          node scripts/release/publish-plan-job-output.mjs restore
          .release/publish-plan/publish-plan.json
        env:
          PUBLISH_PLAN_BASE64: ${{ needs.select-mode.outputs.publish-plan-base64 }}
          PUBLISH_PLAN_SHA256: ${{ needs.select-mode.outputs.publish-plan-sha256 }}
      - name: Verify exact deferred publish scope and committed input hashes
        run: pnpm run release:deferral-check --publish-plan .release/publish-plan/publish-plan.json
      - name: Verify workspace and release state
        run: pnpm run release:workspace-check && pnpm run release:preflight
      - name: Run release policy tests
        run: pnpm run release:test
      - name: Prove the exact independent package impact
        run: >-
          node scripts/release/release-impact.mjs
          --publish-plan .release/publish-plan/publish-plan.json
          --source-ref "${GITHUB_REF}"
          --head "${GITHUB_SHA}"
          --from-release-tags --build-isolated
          --output .release/release-impact.json
      - name: Upload immutable release impact evidence
        id: upload-impact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0, reviewed 2026-08-21
        with:
          name: yakit-ui-release-impact-${{ github.run_id }}
          path: .release/release-impact.json
          if-no-files-found: error
          retention-days: 30
      - name: Build React-only icon package exactly once
        run: pnpm --filter @yakit-libs/yakit-ui-icons run build
      - name: Lint and type-check
        run: pnpm --filter @yakit-libs/yakit-ui-icons run lint && pnpm --filter @yakit-libs/yakit-ui run lint && pnpm --filter @yakit-libs/yakit-ui run test:types
      - name: Install the pinned Playwright browser
        run: pnpm --filter @yakit-libs/yakit-ui exec playwright install --with-deps chromium
      - name: Run component and icon tests
        run: pnpm --filter @yakit-libs/yakit-ui run test:ci && pnpm --filter @yakit-libs/yakit-ui-icons run audit:icons
      - name: Build package exactly once
        run: pnpm --filter @yakit-libs/yakit-ui run build:package
      - name: Verify icon auto-import contracts
        run: pnpm run test:auto-import
      - name: Verify lightweight and dedicated icon package contracts
        run: pnpm --filter @yakit-libs/yakit-ui run test:icon-package-contract
      - name: Verify package and size policy
        run: pnpm --filter @yakit-libs/yakit-ui run verify:package && pnpm run release:policy:check
      - name: Pack publishable packages
        id: pack
        uses: changesets/action/pack@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1 commit, reviewed 2026-08-21

  verify-pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs:
      - select-mode
      - build-and-pack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      package-version: ${{ steps.identity.outputs.package-version }}
      dist-tag: ${{ steps.identity.outputs.dist-tag }}
      tag-name: ${{ steps.identity.outputs.tag-name }}
      commit-sha: ${{ github.sha }}
      release-set: ${{ steps.identity.outputs.release-set }}
      release-matrix: ${{ steps.identity.outputs.release-matrix }}
      verification-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      verification-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      publication-intent-artifact-id: ${{ steps.upload-intent.outputs.artifact-id }}
      publication-intent-artifact-digest: ${{ steps.upload-intent.outputs.artifact-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-21
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, reviewed 2026-08-21
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, reviewed 2026-08-21
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Install verification tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download exact Changesets pack artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0, reviewed 2026-08-21
        with:
          artifact-ids: ${{ needs.build-and-pack.outputs.pack-dir-artifact-id }}
          merge-multiple: true
          path: .release/pack
      - name: Download exact release impact evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0, reviewed 2026-08-21
        with:
          artifact-ids: ${{ needs.build-and-pack.outputs.impact-artifact-id }}
          merge-multiple: true
          path: .release/impact
      - name: Verify tarball contents and hash
        id: pack
        run: node scripts/release/prepare-verification-artifact.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACK_DIRECTORY: .release/pack
          PACK_ARTIFACT_ID: ${{ needs.build-and-pack.outputs.pack-dir-artifact-id }}
          RELEASE_IMPACT_OUTPUT: .release/impact/release-impact.json
      - name: Measure and bind the exact icons tarball when released
        run: node scripts/release/verify-icons-size-gate.mjs .release/verified
      - name: Install candidate with the frozen exact counterpart baseline
        run: node scripts/release/verify-tarball-consumer.mjs .release/verified
      - name: Seal exact consumer verification in the final manifest
        run: node scripts/release/record-verification-gate.mjs .release/verified/verification-manifest.json consumer
      - name: Resolve package release identity
        id: identity
        run: node scripts/release/emit-release-identity.mjs
        env:
          PACK_ARTIFACT_ID: ${{ needs.build-and-pack.outputs.pack-dir-artifact-id }}
      - name: Upload immutable verification evidence
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0, reviewed 2026-08-21
        with:
          name: yakit-ui-verification-${{ github.run_id }}
          path: .release/verified
          if-no-files-found: error
          retention-days: 30
      - name: Inventory every prior publication intent and receipt
        id: inventory
        run: >-
          node scripts/release/inventory-publication-artifacts.mjs
          .release/verified .release/prior-publication-inventory.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Download exact inventoried publication state artifacts
        if: steps.inventory.outputs.has-artifacts == 'true'
        run: >-
          node scripts/release/download-publication-artifacts.mjs
          .release/prior-publication-inventory.json
          .release/prior-publish-state
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Reconcile registry and prepare durable publication intent
        run: >-
          node scripts/release/prepare-publication-attempt.mjs
          .release/verified .release/publish-intent
          .release/prior-publication-inventory.json
          .release/prior-publish-state
      - name: Upload durable pre-side-effect publication intent
        id: upload-intent
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0, reviewed 2026-08-21
        with:
          name: yakit-ui-publish-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/publish-intent
          if-no-files-found: error
          retention-days: 30

  publish:
    # Keep this disabled unless branch protection requires PRs and CI, the
    # npm-release Environment has a required reviewer, and npm Trusted
    # Publishing is configured. Otherwise publish the verified artifact
    # locally with interactive 2FA.
    if: needs.select-mode.outputs.mode == 'publish' && vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    needs:
      - select-mode
      - build-and-pack
      - verify-pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.consume.outputs.published }}
      published-packages: ${{ steps.consume.outputs.published-packages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-21
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, reviewed 2026-08-21
        with:
          version: 10.34.5
      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, reviewed 2026-08-21
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install release tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download exact verification evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0, reviewed 2026-08-21
        with:
          artifact-ids: ${{ needs.verify-pack.outputs.verification-artifact-id }}
          merge-multiple: true
          path: .release/verified
      - name: Download durable pre-side-effect publication intent
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0, reviewed 2026-08-21
        with:
          artifact-ids: ${{ needs.verify-pack.outputs.publication-intent-artifact-id }}
          merge-multiple: true
          path: .release/publish-intent
      - name: Assert Trusted Publishing runtime
        run: node scripts/release/assert-publish-runtime.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACK_ARTIFACT_ID: ${{ needs.build-and-pack.outputs.pack-dir-artifact-id }}
          VERIFICATION_ARTIFACT_DIGEST: ${{ needs.verify-pack.outputs.verification-artifact-digest }}
          VERIFICATION_ARTIFACT_ID: ${{ needs.verify-pack.outputs.verification-artifact-id }}
      - name: Consume immutable publication outbox and publish exact tarballs
        id: consume
        run: >-
          node scripts/release/publish-verification-artifact.mjs
          .release/verified .release/publish-intent
          .release/publish-receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_INTENT_ARTIFACT_ID: ${{ needs.verify-pack.outputs.publication-intent-artifact-id }}
          PUBLICATION_INTENT_ARTIFACT_DIGEST: ${{ needs.verify-pack.outputs.publication-intent-artifact-digest }}
      - name: Upload append-only publication receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0, reviewed 2026-08-21
        with:
          name: yakit-ui-publish-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/publish-receipt
          if-no-files-found: error
          retention-days: 30

  post-publish:
    if: needs.publish.outputs.published == 'true'
    needs:
      - publish
      - verify-pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.verify-pack.outputs.release-matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-21
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, reviewed 2026-08-21
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Verify exact registry version
        run: node scripts/release/post-publish-smoke.mjs
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          PACKAGE_VERSION: ${{ matrix.version }}
          DIST_TAG: ${{ matrix.distTag }}

  metadata:
    if: needs.publish.outputs.published == 'true'
    needs:
      - publish
      - verify-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.verify-pack.outputs.release-matrix) }}
    steps:
      - name: Check out repository scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-21
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, reviewed 2026-08-21
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Reconcile tag and GitHub release
        run: node scripts/release/reconcile-github-metadata.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.tag }}
          RELEASE_COMMIT: ${{ needs.verify-pack.outputs.commit-sha }}
          PACKAGE_NAME: ${{ matrix.package }}
          PACKAGE_VERSION: ${{ matrix.version }}

  recovery-verify:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery && !inputs.reconciliation_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      package-name: ${{ steps.identity.outputs.package-name }}
      package-version: ${{ steps.identity.outputs.package-version }}
      tag-name: ${{ steps.identity.outputs.tag-name }}
      commit-sha: ${{ steps.identity.outputs.commit-sha }}
      has-missing: ${{ steps.identity.outputs.has-missing }}
      release-matrix: ${{ steps.identity.outputs.release-matrix }}
      recovery-intent-artifact-id: ${{ steps.upload-intent.outputs.artifact-id }}
      recovery-intent-artifact-digest: ${{ steps.upload-intent.outputs.artifact-digest }}
      incident-resolution-artifact-id: ${{ steps.upload-incident-resolution.outputs.artifact-id }}
      incident-resolution-artifact-digest: ${{ steps.upload-incident-resolution.outputs.artifact-digest }}
    steps:
      - name: Check recovery inputs
        run: |
          test -n "$RECOVERY_SOURCE_RUN_ID"
          test -n "$RECOVERY_VERIFICATION_ARTIFACT_ID"
          if test -n "$INCIDENT_ID"; then
            test "$AUTHORIZE_PUBLICATION_RETRY" = "true"
            test -n "$RETRY_INTENT_ARTIFACT_ID"
            test -n "$RETRY_RECEIPT_ARTIFACT_ID"
          fi
        env:
          AUTHORIZE_PUBLICATION_RETRY: ${{ inputs.authorize_retry }}
          INCIDENT_ID: ${{ inputs.incident_id }}
          RECOVERY_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RECOVERY_VERIFICATION_ARTIFACT_ID: ${{ inputs.verification_artifact_id }}
          RETRY_INTENT_ARTIFACT_ID: ${{ inputs.retry_intent_artifact_id }}
          RETRY_RECEIPT_ARTIFACT_ID: ${{ inputs.retry_receipt_artifact_id }}
      - name: Check out repository scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-21
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect complete cutover evidence
        run: >-
          node scripts/release/collect-release-cutover-evidence.mjs
          .release/cutover-evidence.json .release/cutover-producer.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Enforce the v3 recovery cutover
        if: inputs.incident_id == ''
        run: node scripts/release/release-cutover-preflight.mjs
        env:
          RELEASE_CUTOVER_EVIDENCE: .release/cutover-evidence.json
          RELEASE_INCIDENT_RESOLUTION: ${{ inputs.incident_id != '' && '.release/incident-resolution/incident-resolution.json' || '' }}
          RELEASE_PRODUCER_IDENTITY: .release/cutover-producer.json
      - name: Resolve the exact checked-in private provenance incident
        if: inputs.incident_id != ''
        run: >-
          node scripts/release/private-provenance-recovery.mjs
          "$INCIDENT_ID" .release/cutover-evidence.json
          .release/incident-resolution/incident-resolution.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          INCIDENT_ID: ${{ inputs.incident_id }}
      - name: Re-enforce cutover with the exact incident resolution
        if: inputs.incident_id != ''
        run: node scripts/release/release-cutover-preflight.mjs
        env:
          RELEASE_CUTOVER_EVIDENCE: .release/cutover-evidence.json
          RELEASE_INCIDENT_RESOLUTION: .release/incident-resolution/incident-resolution.json
          RELEASE_PRODUCER_IDENTITY: .release/cutover-producer.json
      - name: Upload append-only incident resolution
        if: inputs.incident_id != ''
        id: upload-incident-resolution
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0, reviewed 2026-08-21
        with:
          name: yakit-ui-incident-resolution-${{ inputs.incident_id }}-${{ github.run_id }}
          path: .release/incident-resolution/incident-resolution.json
          if-no-files-found: error
          retention-days: 30
      - name: Download exact cross-run verification artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0, reviewed 2026-08-21
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          artifact-ids: ${{ inputs.verification_artifact_id }}
          merge-multiple: true
          path: .release/recovery
      - name: Inventory every source and recovery publication state artifact
        id: inventory
        run: >-
          node scripts/release/inventory-publication-artifacts.mjs
          .release/recovery .release/prior-recovery-inventory.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Download exact inventoried source and recovery state artifacts
        if: steps.inventory.outputs.has-artifacts == 'true'
        run: >-
          node scripts/release/download-publication-artifacts.mjs
          .release/prior-recovery-inventory.json
          .release/prior-recovery-state
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate retained evidence and registry identity
        id: identity
        run: node scripts/release/recover-partial-publication.mjs .release/recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERIFICATION_ARTIFACT_ID: ${{ inputs.verification_artifact_id }}
      - name: Prepare durable recovery publication intent
        if: steps.identity.outputs.has-missing == 'true'
        run: >-
          node scripts/release/prepare-publication-attempt.mjs
          .release/recovery .release/recovery-intent
          .release/prior-recovery-inventory.json
          .release/prior-recovery-state
        env:
          AUTHORIZE_PUBLICATION_RETRY: ${{ inputs.authorize_retry }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PRIVATE_PROVENANCE_RESOLUTION_ARTIFACT_DIGEST: ${{ steps.upload-incident-resolution.outputs.artifact-digest }}
          PRIVATE_PROVENANCE_RESOLUTION_ARTIFACT_ID: ${{ steps.upload-incident-resolution.outputs.artifact-id }}
          PRIVATE_PROVENANCE_RESOLUTION_PATH: ${{ inputs.incident_id != '' && '.release/incident-resolution/incident-resolution.json' || '' }}
          RETRY_INTENT_ARTIFACT_ID: ${{ inputs.retry_intent_artifact_id }}
          RETRY_RECEIPT_ARTIFACT_ID: ${{ inputs.retry_receipt_artifact_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      - name: Upload durable pre-side-effect recovery intent
        if: steps.identity.outputs.has-missing == 'true'
        id: upload-intent
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0, reviewed 2026-08-21
        with:
          name: yakit-ui-recovery-intent-${{ inputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/recovery-intent
          if-no-files-found: error
          retention-days: 30

  recovery-publish:
    if: >-
      needs.recovery-verify.outputs.has-missing == 'true' &&
      vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    needs: recovery-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-21
        with:
          persist-credentials: false
      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, reviewed 2026-08-21
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download exact cross-run verification artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0, reviewed 2026-08-21
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          artifact-ids: ${{ inputs.verification_artifact_id }}
          merge-multiple: true
          path: .release/recovery
      - name: Download durable pre-side-effect recovery intent
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0, reviewed 2026-08-21
        with:
          artifact-ids: ${{ needs.recovery-verify.outputs.recovery-intent-artifact-id }}
          merge-multiple: true
          path: .release/recovery-intent
      - name: Download exact append-only incident resolution
        if: needs.recovery-verify.outputs.incident-resolution-artifact-id != ''
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0, reviewed 2026-08-21
        with:
          artifact-ids: ${{ needs.recovery-verify.outputs.incident-resolution-artifact-id }}
          merge-multiple: true
          path: .release/incident-resolution
      - name: Publish only missing exact verified tarballs
        id: consume
        run: >-
          node scripts/release/publish-verification-artifact.mjs
          .release/recovery .release/recovery-intent
          .release/recovery-receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_INTENT_ARTIFACT_ID: ${{ needs.recovery-verify.outputs.recovery-intent-artifact-id }}
          PUBLICATION_INTENT_ARTIFACT_DIGEST: ${{ needs.recovery-verify.outputs.recovery-intent-artifact-digest }}
          PRIVATE_PROVENANCE_RESOLUTION_ARTIFACT_DIGEST: ${{ needs.recovery-verify.outputs.incident-resolution-artifact-digest }}
          PRIVATE_PROVENANCE_RESOLUTION_ARTIFACT_ID: ${{ needs.recovery-verify.outputs.incident-resolution-artifact-id }}
          PRIVATE_PROVENANCE_RESOLUTION_PATH: ${{ needs.recovery-verify.outputs.incident-resolution-artifact-id != '' && '.release/incident-resolution/incident-resolution.json' || '' }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERIFICATION_ARTIFACT_ID: ${{ inputs.verification_artifact_id }}
      - name: Upload append-only recovery receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0, reviewed 2026-08-21
        with:
          name: yakit-ui-recovery-receipt-${{ inputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/recovery-receipt
          if-no-files-found: error
          retention-days: 30

  recovery-metadata:
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.recovery &&
      needs.recovery-verify.result == 'success' &&
      (needs.recovery-publish.result == 'success' ||
      (needs.recovery-verify.outputs.has-missing == 'false' &&
      needs.recovery-publish.result == 'skipped'))
    needs:
      - recovery-verify
      - recovery-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.recovery-verify.outputs.release-matrix) }}
    steps:
      - name: Check out repository scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed 2026-08-21
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, reviewed 2026-08-21
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Reconcile tag and GitHub release only
        run: node scripts/release/reconcile-github-metadata.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.package }}@${{ matrix.version }}
          RELEASE_COMMIT: ${{ needs.recovery-verify.outputs.commit-sha }}
          PACKAGE_NAME: ${{ matrix.package }}
          PACKAGE_VERSION: ${{ matrix.version }}

  reconcile-published:
    if: github.event_name == 'workflow_dispatch' && inputs.reconciliation_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      VERIFICATION_ARTIFACT_ID: ${{ inputs.verification_artifact_id }}
      GITHUB_TOKEN: ${{ github.token }}
      AUTHORIZE_PUBLICATION_RETRY: ${{ inputs.authorize_retry }}
      INCIDENT_ID: ${{ inputs.incident_id }}
    steps:
      - name: Reject mixed recovery authority
        run: |
          test "$RECOVERY" = "false"
          test "$AUTHORIZE_PUBLICATION_RETRY" = "false"
          test -z "$INCIDENT_ID"
          test -z "$RETRY_INTENT"
          test -z "$RETRY_RECEIPT"
        env:
          RECOVERY: ${{ inputs.recovery }}
          RETRY_INTENT: ${{ inputs.retry_intent_artifact_id }}
          RETRY_RECEIPT: ${{ inputs.retry_receipt_artifact_id }}
      - name: Check out reviewed reconciliation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Verify all published bytes and prepare reconciliation
        run: node scripts/release/reconcile-published-artifact.mjs prepare .release/reconciliation
      - name: Upload fully reconciled immutable intent
        id: intent
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: yakit-ui-recovery-intent-${{ inputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/reconciliation/intent
          if-no-files-found: error
          retention-days: 30
      - name: Bind durable intent and seal successful reconciliation receipt
        run: node scripts/release/reconcile-published-artifact.mjs receipt .release/reconciliation
        env:
          PUBLICATION_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
          PUBLICATION_INTENT_ARTIFACT_DIGEST: ${{ steps.intent.outputs.artifact-digest }}
      - name: Upload validated append-only success receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: yakit-ui-recovery-receipt-${{ inputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/reconciliation/receipt
          if-no-files-found: error
          retention-days: 30
