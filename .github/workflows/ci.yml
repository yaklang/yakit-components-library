name: CI

on:
  pull_request:
  push:
    branches:
      - 'pre/**'

permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      icons: ${{ steps.scope.outputs.icons }}
      icon_build: ${{ steps.scope.outputs.icon_build }}
      ui: ${{ steps.scope.outputs.ui }}
      integration: ${{ steps.scope.outputs.integration }}
      storybook: ${{ steps.scope.outputs.storybook }}
      release_tools: ${{ steps.scope.outputs.release_tools }}
      isolation: ${{ steps.scope.outputs.isolation }}
      platforms: ${{ steps.scope.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - run: node --test test/ci/*.test.mjs
      - id: scope
        run: node scripts/ci/scope.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}

  repository:
    needs: scope
    if: needs.scope.outputs.icon_build == 'true' || needs.scope.outputs.release_tools == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check release scope and package boundaries
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch --no-track main refs/remotes/origin/main
          pnpm run release:deferral-check
          pnpm run release:workspace-check

  icons:
    needs: scope
    if: needs.scope.outputs.icon_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - if: needs.scope.outputs.icons == 'true'
        run: pnpm --filter @yakit-libs/yakit-ui-icons exec playwright install --with-deps chromium
      - if: needs.scope.outputs.icons == 'true'
        run: pnpm --filter @yakit-libs/yakit-ui-icons run lint
      - if: needs.scope.outputs.icons == 'true'
        run: pnpm icons:check
      - name: Build icons once for downstream consumers
        run: pnpm --filter @yakit-libs/yakit-ui-icons run build
      - run: pnpm --filter @yakit-libs/yakit-ui-icons run verify:package
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: icons-dist
          path: packages/yakit-ui-icons/dist
          if-no-files-found: error
          retention-days: 1

  ui:
    needs: [scope, icons]
    if: needs.scope.outputs.integration == 'true' || needs.scope.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: icons-dist
          path: packages/yakit-ui-icons/dist
      - if: needs.scope.outputs.ui == 'true'
        run: pnpm --filter @yakit-libs/yakit-ui run lint
      - if: needs.scope.outputs.icons != 'true'
        run: pnpm icons:update --check && node --test test/icons/*.test.mjs
      - run: pnpm --filter @yakit-libs/yakit-ui run test:types
      - run: pnpm --filter @yakit-libs/yakit-ui exec playwright install --with-deps chromium
      - if: needs.scope.outputs.ui == 'true'
        run: pnpm --filter @yakit-libs/yakit-ui run test:ci
      - run: pnpm --filter @yakit-libs/yakit-ui run test:icon-integration
      - if: needs.scope.outputs.storybook == 'true'
        run: pnpm --filter @yakit-libs/yakit-ui run build:package:prepared
      - if: needs.scope.outputs.storybook != 'true'
        run: pnpm --filter @yakit-libs/yakit-ui run build:lib:prepared
      - if: needs.scope.outputs.storybook == 'true'
        run: pnpm --dir storybook run lint && pnpm --dir storybook run check-types && pnpm --dir storybook run build:static
      - run: pnpm run test:auto-import
      - run: pnpm --filter @yakit-libs/yakit-ui run test:icon-package-contract
      - run: pnpm --filter @yakit-libs/yakit-ui exec vitest run --config vitest.node.config.ts test/icons/dist-consumer.test.ts test/icons/icon-stroke-width-dist.test.ts test/icons/icon-adjustable-consumer.test.ts
      - if: needs.scope.outputs.storybook == 'true'
        run: pnpm --filter @yakit-libs/yakit-ui run pack:dry-run

  release-tools:
    needs: scope
    if: needs.scope.outputs.release_tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:test

  icon-platforms:
    needs: scope
    if: needs.scope.outputs.platforms == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yakit-libs/yakit-ui-icons exec playwright install chromium
      - name: Import, generate, check and render on this platform
        run: pnpm icons:check
      - run: pnpm --filter @yakit-libs/yakit-ui-icons run build
      - run: pnpm --filter @yakit-libs/yakit-ui-icons run verify:package

  icon-isolation:
    needs: scope
    if: needs.scope.outputs.isolation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:verify-isolation

  quality:
    if: always()
    needs: [scope, repository, icons, ui, release-tools, icon-platforms, icon-isolation]
    runs-on: ubuntu-latest
    steps:
      - name: Require success for selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (jobs.scope.result !== "success" || Object.values(jobs).some(job => !["success", "skipped"].includes(job.result))) process.exit(1)'
